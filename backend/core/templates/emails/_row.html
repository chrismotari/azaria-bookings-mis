<tr>
  <td valign="top" style="padding:8px 12px 8px 0; border-bottom:1px solid {{ brand.border }}; color:{{ brand.muted }}; font-size:14px; width:40%;">{{ label }}</td>
  <td valign="top" style="padding:8px 0; border-bottom:1px solid {{ brand.border }}; color:{{ brand.text }}; font-size:14px;">{% if price %}<span style="background-color:{{ brand.accent }}; color:{{ brand.accent_text }}; font-weight:bold; padding:2px 8px; border-radius:4px;">{{ value }}</span>{% else %}{{ value|linebreaksbr }}{% endif %}</td>
</tr>
