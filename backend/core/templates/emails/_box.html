<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px 0;">
  <tr>
    <td style="background-color:{{ brand.highlight }}; border-left:4px solid {{ brand.primary }}; border-radius:4px; padding:12px 16px; color:{{ brand.text }}; font-size:14px; line-height:21px;">
      {% if title %}<strong>{{ title }}</strong><br>{% endif %}{{ text|linebreaksbr }}
    </td>
  </tr>
</table>
